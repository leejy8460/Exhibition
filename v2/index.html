<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATELIER NORD — Exhibition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=7" />
  </head>
  <body>
    <header class="hero">
      <img
        class="hero__image"
        src="https://picsum.photos/seed/atelier-nord-hero/1600/1000"
        alt=""
        width="1600"
        height="1000"
      />
      <div class="hero__veil"></div>
      <div class="hero__content">
        <p class="hero__brand">Atelier Nord</p>
        <h1 class="hero__title">빛의 가장자리에서</h1>
        <p class="hero__lead">사진·미술·우주 — 골라 보는 가상 전시회</p>
        <a class="hero__cta" href="#gallery">전시 입장</a>
      </div>
    </header>

    <main>
      <section class="gallery" id="gallery" aria-labelledby="gallery-heading">
        <div class="gallery__intro">
          <div class="gallery__intro-top">
            <h2 id="gallery-heading">Collection</h2>
            <div class="gallery__controls">
              <label class="gallery__source" for="source-select">
                <span class="gallery__size-label">전시 종류</span>
                <select class="gallery__source-select" id="source-select"></select>
              </label>
              <label class="gallery__size" for="size-slider">
                <span class="gallery__size-label">사진 크기</span>
                <input
                  class="gallery__size-input"
                  id="size-slider"
                  type="range"
                  min="160"
                  max="480"
                  value="280"
                  step="10"
                />
              </label>
              <button class="gallery__renew" id="renew-btn" type="button">
                전시 갱신
              </button>
            </div>
          </div>
          <p id="gallery-blurb">익명의 시선으로 포착한 풍경, 인물, 그리고 고요한 일상.</p>
        </div>
        <div class="gallery__grid" id="gallery-grid"></div>
      </section>
    </main>

    <footer class="footer">
      <p class="footer__brand">Atelier Nord · v2</p>
      <p class="footer__note">
        <span id="version-switch">
          <a href="./ai/">AI 제목 버전 (사진 전시)</a>
          ·
        </span>
        <span id="legacy-link"><a href="../">이전 기본 버전</a> · </span>
        <span id="credit-note">Images courtesy of Lorem Picsum</span>
      </p>
    </footer>

    <dialog class="lightbox" id="lightbox" aria-label="작품 확대 보기">
      <button class="lightbox__close" type="button" aria-label="닫기">
        닫기
      </button>
      <img class="lightbox__image" id="lightbox-image" alt="" />
      <p class="lightbox__caption" id="lightbox-caption"></p>
    </dialog>

    <script>
      window.EXHIBITION_USE_AI = false;
    </script>
    <script src="js/sources.js?v=9"></script>
    <script src="js/gallery-app.js?v=9"></script>
  </body>
</html>
